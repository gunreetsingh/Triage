<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triage: what users want fixed</title>
  <meta name="description" content="Thousands of App Store and Google Play reviews, grouped into themes and ranked by what to fix first.">
  <meta name="theme-color" content="#e9e3d6">
  <script>
    // Paper by default; apply a saved dark preference before first paint.
    try { if (localStorage.getItem("triage-theme-v3") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M11.5 3H29v26H11.5L3 16Z' fill='%23e8361e' stroke='%2315130f' stroke-width='1.5'/%3E%3Ccircle cx='10.6' cy='16' r='2.6' fill='%23e9e3d6' stroke='%2315130f' stroke-width='1.5'/%3E%3Crect x='16.5' y='10.5' width='8.5' height='2.6' fill='%23fff8ec'/%3E%3Crect x='16.5' y='14.7' width='6.5' height='2.6' fill='%23fff8ec'/%3E%3Crect x='16.5' y='18.9' width='4.5' height='2.6' fill='%23fff8ec'/%3E%3C/svg%3E">
  <!-- Smooth scrolling. Optional: the site falls back to native scrolling without it. -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script type="module" src="assets/main.js"></script>
</head>
<body>
  <div class="curtain boot" aria-hidden="true">
    <div class="curtain-mark">
      <svg class="curtain-logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M11.5 3H29v26H11.5L3 16Z" fill="currentColor"/><circle cx="10.6" cy="16" r="2.6" fill="var(--signal)"/><rect x="16.5" y="10.5" width="8.5" height="2.6" fill="var(--signal)"/><rect x="16.5" y="14.7" width="6.5" height="2.6" fill="var(--signal)"/><rect x="16.5" y="18.9" width="4.5" height="2.6" fill="var(--signal)"/></svg>
      <span>Triage</span>
    </div>
    <div class="curtain-bar"><span></span></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="progress" aria-hidden="true"><span></span></div>

  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="#/" aria-label="Triage home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M11.5 3H29v26H11.5L3 16Z" class="bm-bg"/><circle cx="10.6" cy="16" r="2.6" class="bm-hole"/><rect x="16.5" y="10.5" width="8.5" height="2.6" class="bm-bar"/><rect x="16.5" y="14.7" width="6.5" height="2.6" class="bm-bar"/><rect x="16.5" y="18.9" width="4.5" height="2.6" class="bm-bar"/>
        </svg>
        <span>Triage</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="#/" data-nav="story">Story</a>
        <a href="#/apps" data-nav="apps">Apps</a>
        <a href="#/how" data-nav="how">Method</a>
      </nav>
      <div class="nav-tools">
        <button type="button" class="nav-search" data-palette aria-label="Search any app">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <span>Search any app</span><kbd>⌘K</kbd>
        </button>
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch color theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.3 8.3 0 0 1 9.4 4a8.3 8.3 0 1 0 10.6 10.6Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <div class="drawer-backdrop" aria-hidden="true"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true"></aside>

  <div class="palette" role="dialog" aria-modal="true" aria-label="Search any app" aria-hidden="true">
    <div class="palette-scrim"></div>
    <div class="palette-box" data-lenis-prevent>
      <div class="palette-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input class="palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list" aria-label="Search apps" placeholder="Search any app…" autocomplete="off" spellcheck="false">
        <label class="sr-only" for="pal-market">App Store market</label>
        <select class="palette-market" id="pal-market" hidden></select>
        <kbd>esc</kbd>
      </div>
      <ul class="palette-list" id="pal-list" role="listbox"></ul>
    </div>
  </div>

  <div class="tooltip" role="tooltip" aria-hidden="true"></div>
  <noscript><p class="noscript">Triage needs JavaScript to load its data.</p></noscript>
</body>
</html>
